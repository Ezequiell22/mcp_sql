- {"outcome": "selected", "names": ["one exact schema name"]} when one source matches.
  Select up to eight exact schemas when the request requires combining their data.
  Do not combine alternative copies unless the request explicitly needs both.
- {"outcome": "no_match", "names": []} when the requested business entity cannot
