name: Verify SQL MCP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install pinned dependencies and package
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Source and schema consistency
        run: |
          python scripts/verify.py --checks-only
          git diff --check
      - name: Prepare disposable integration image
        run: docker pull postgres:18
      - name: Test standalone service with disposable PostgreSQL
        env:
          ALLOW_SYNTHETIC_DB_WRITES: '1'
        run: python -m pytest
      - name: Build independent package
        run: python -m pip wheel --no-deps . --wheel-dir dist
  docker-sqlserver:
    # Repository owner enables this only after accepting Microsoft's driver/server EULAs.
    if: vars.ACCEPT_SQLSERVER_EULA == 'Y'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sqlserver: ['2022-latest', '2025-latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install test harness
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Build real dual-database runtime
        run: docker build --build-arg ACCEPT_EULA=Y -t atlas-sql-mcp:ci .
      - name: Prepare isolated database images
        run: |
          docker pull postgres:18
          docker pull mcr.microsoft.com/mssql/server:${{ matrix.sqlserver }}
      - name: Agent workflows and verified TLS from Docker
        env:
          ALLOW_SYNTHETIC_DB_WRITES: '1'
          ACCEPT_SQLSERVER_EULA: 'Y'
          ATLAS_SQL_DOCKER_IMAGE: atlas-sql-mcp:ci
          ATLAS_SQL_SQLSERVER_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.sqlserver }}
        run: python scripts/verify.py --integration

  release-readiness:
    # Tag builds cannot be green when licensed dual-database verification was skipped.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, docker-sqlserver]
    runs-on: ubuntu-latest
    steps:
      - name: Require both database integration matrices
        env:
          BASE_RESULT: ${{ needs.verify.result }}
          DUAL_DATABASE_RESULT: ${{ needs.docker-sqlserver.result }}
        run: |
          test "$BASE_RESULT" = success
          test "$DUAL_DATABASE_RESULT" = success
