name: atlas-sql
services:
  mcp:
    image: atlas-sql-mcp:local
    build:
      context: .
      args:
        ACCEPT_EULA: ${ACCEPT_EULA:-N}
    container_name: atlas-sql-mcp
    command: ["--transport", "stdio"]
    stdin_open: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    environment:
      ATLAS_SQL_TIMEZONE: ${ATLAS_SQL_TIMEZONE:-UTC}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
