# Merge this section into ~/.codex/config.toml.
# Absolute paths are configured for this checkout. Credentials come from the process environment.
[mcp_servers.atlas_sql]
command = "/Users/ezequielmenegas/git/mcp-sql/.venv/bin/atlas-sql-mcp"
args = ["--connections", "/Users/ezequielmenegas/git/mcp-sql/connections.local.json", "--transport", "stdio"]
env_vars = ["ATLAS_SALES_DB_PASSWORD", "ATLAS_SQLSERVER_PASSWORD", "PGPASSFILE", "PGSSLROOTCERT"]
startup_timeout_sec = 20
tool_timeout_sec = 120

