# Merge this section into your Codex MCP configuration.
# Replace the executable path after installation; users supply connection strings in chat.
[mcp_servers.atlas_sql]
command = "/absolute/path/mcp-sql/.venv/bin/atlas-sql-mcp"
args = ["--transport", "stdio"]
env_vars = ["PGSSLROOTCERT", "SSL_CERT_FILE"]
startup_timeout_sec = 20
tool_timeout_sec = 120
