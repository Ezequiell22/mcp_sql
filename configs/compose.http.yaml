# Server deployment behind an externally controlled HTTPS ingress; no MCP authentication.
services:
  mcp:
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8091"]
    env_file:
      - path: ${ATLAS_SQL_HTTP_ENV_FILE:?Set ATLAS_SQL_HTTP_ENV_FILE to an absolute private environment file}
        required: true
    ports:
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
