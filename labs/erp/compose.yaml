name: atlas-erp-lab
services:
  postgres:
    image: postgres:18
    container_name: atlas-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: adempiere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Use the private lab env file}
      POSTGRES_DB: idempiere
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ${LAB_DIR:?}/tls:/lab-tls:ro
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        cp /lab-tls/server.crt /tmp/server.crt
        cp /lab-tls/server.key /tmp/server.key
        chown postgres:postgres /tmp/server.crt /tmp/server.key
        chmod 600 /tmp/server.key
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adempiere -d idempiere"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    networks:
      default:
        aliases: [erp-postgres]
  sqlserver-us:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: atlas-erp-sqlserver-us
    restart: unless-stopped
    environment:
      ACCEPT_EULA: ${ACCEPT_SQLSERVER_EULA:?Set ACCEPT_SQLSERVER_EULA=Y after accepting Microsoft SQL Server terms}
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports: ["127.0.0.1:51433:1433"]
    volumes:
      - sqlserver-us-data:/var/opt/mssql
      - ${LAB_DIR:?}/downloads:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S tcp:127.0.0.1,1433 -U sa -C -b -Q \"SELECT 1\" -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 2500m
    networks:
      default:
        aliases: [erp-sqlserver-us]
  sqlserver-br:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: atlas-erp-sqlserver-br
    restart: unless-stopped
    environment:
      ACCEPT_EULA: ${ACCEPT_SQLSERVER_EULA:?Set ACCEPT_SQLSERVER_EULA=Y after accepting Microsoft SQL Server terms}
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports: ["127.0.0.1:52433:1433"]
    volumes:
      - sqlserver-br-data:/var/opt/mssql
      - ${LAB_DIR:?}/downloads:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S tcp:127.0.0.1,1433 -U sa -C -b -Q \"SELECT 1\" -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 2500m
    networks:
      default:
        aliases: [erp-sqlserver-br]
volumes:
  postgres-data:
  sqlserver-us-data:
  sqlserver-br-data:
